<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHEEL OF DOOM — TikTok LIVE</title>
<style>
:root{color-scheme:dark;--cyan:#65e9f2;--pink:#ff4d88;--gold:#ffd36e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:transparent;color:#fff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:16px;overflow:hidden}
main{position:relative;isolation:isolate;width:min(100%,780px);text-align:center;padding:22px 18px 18px;border:1px solid #8c7770;border-radius:30px;background:linear-gradient(145deg,#17191c,#29221f 55%,#101820);box-shadow:0 14px 40px #000b;backdrop-filter:blur(8px);opacity:1;visibility:visible;transform:translateY(0) scale(1);transition:opacity .7s ease,transform .7s ease,visibility .7s}to{transform:translate(12px,-10px) scale(1.05)}}.live-mode main{opacity:0;visibility:hidden;transform:translateY(24px) scale(.96)}.live-mode.active main{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.tag{display:block;width:max-content;max-width:100%;margin:0 auto 8px;color:#f4e8df;letter-spacing:3px;font-weight:1000;font-size:12px;padding:8px 16px;border:1px solid #8d7568;border-radius:999px;background:#27211e;text-shadow:0 2px 5px #000}.battle-tag{color:#ffd8ad;border-color:#a65c35;background:#38251c}h1{font-size:clamp(32px,8vw,64px);line-height:1;margin:12px 0;color:#fff;letter-spacing:1px;text-shadow:0 3px 0 #3a2117,0 5px 12px #000}.sub{color:#e6d9ff;margin:0 0 16px;font-weight:650}
.wheel-wrap{width:min(78vw,470px);aspect-ratio:1;margin:34px auto 26px;position:relative;filter:drop-shadow(0 18px 28px #000)}.smoke-plume,.flame-plume{position:absolute;z-index:0;inset:-48px;border-radius:50%;pointer-events:none}.smoke-plume{background:radial-gradient(ellipse at 22% 24%,#c0c0bdcc 0 5%,transparent 27%),radial-gradient(ellipse at 76% 18%,#777b7dcc 0 9%,transparent 34%),radial-gradient(ellipse at 49% 0%,#a4a5a2cc 0 8%,transparent 32%),radial-gradient(ellipse at 92% 58%,#777b7dcc 0 8%,transparent 31%),radial-gradient(ellipse at 8% 66%,#a4a5a2cc 0 9%,transparent 33%),radial-gradient(ellipse at 54% 100%,#4c4c4ccc 0 10%,transparent 36%);filter:blur(18px);animation:smokeBillow 2.8s ease-in-out infinite alternate}.flame-plume{inset:-37px;background:radial-gradient(ellipse at 50% 100%,#fff3a0 0 2%,#ff9b20 5%,#f13b0a 12%,transparent 29%),radial-gradient(ellipse at 4% 55%,#fff0a0 0 2%,#ff9b20 5%,#e52a08 13%,transparent 30%),radial-gradient(ellipse at 96% 55%,#fff0a0 0 2%,#ff9b20 5%,#e52a08 13%,transparent 30%),radial-gradient(ellipse at 22% 5%,#ffd06a 0 3%,#fa4a0c 10%,transparent 28%),radial-gradient(ellipse at 78% 5%,#ffd06a 0 3%,#fa4a0c 10%,transparent 28%);filter:blur(7px) saturate(1.5);animation:flameFlicker .28s ease-in-out infinite alternate}.flame-plume:before,.flame-plume:after{content:"";position:absolute;inset:-8px;border-radius:50%;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 9deg,#ff4b0b99 10deg 13deg,transparent 15deg 23deg);mask:radial-gradient(circle,transparent 54%,#000 58%,#000 72%,transparent 78%);filter:blur(9px);animation:fireRotate 10s linear infinite}.flame-plume:after{background:repeating-conic-gradient(from 13deg at 50% 50%,transparent 0deg 13deg,#ffc04a99 14deg 17deg,transparent 19deg 27deg);filter:blur(5px);animation:fireRotate 7s linear infinite reverse}.@keyframes smokeBillow{from{transform:translate(-12px,12px) scale(.88);opacity:.62}to{transform:translate(13px,-20px) scale(1.18);opacity:1}}@keyframes flameFlicker{from{transform:scale(.96,.88);opacity:.8}to{transform:scale(1.08,1.13);opacity:1}}@keyframes fireRotate{to{transform:rotate(360deg)}}
#fire{position:absolute;z-index:2;inset:-50px;width:calc(100% + 100px);height:calc(100% + 100px);pointer-events:none;overflow:visible}.pointer{z-index:4}.hub{z-index:3}@keyframes orbit{to{transform:rotate(360deg)}}
canvas{position:relative;z-index:1;width:100%;height:100%;display:block;border-radius:50%}
.pointer{position:absolute;z-index:2;top:-17px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:0;border-bottom:54px solid #fff09a;filter:drop-shadow(0 0 8px #fff09a) drop-shadow(0 4px 4px #000)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#ffe28a 18%,#ff7a4d 48%,#8b164f 78%,#280b37);border:6px solid #fff1ad;box-shadow:0 3px 12px #000;pointer-events:none}
button{font:inherit;font-weight:1000;letter-spacing:1.5px;border:2px solid #ffd6f0;border-radius:999px;padding:15px 32px;background:linear-gradient(100deg,#ff3d83,#a23cff 55%,#3d8dff);color:white;text-shadow:0 2px 4px #47104f;box-shadow:0 5px 0 #35271f,0 8px 18px #0009;cursor:pointer;animation:buttonGlow 2s ease-in-out infinite alternate;transition:transform .15s}button:hover{transform:translateY(-3px) scale(1.03)}button:disabled{opacity:.5;cursor:wait;animation:none}@keyframes buttonGlow{to{box-shadow:0 5px 0 #35271f,0 10px 22px #000b}}
.result{min-height:96px;margin:18px auto 12px;padding:17px;border:1px solid #ff9acaaa;border-radius:20px;background:linear-gradient(140deg,#3a174bee,#171b43ee);max-width:640px;box-shadow:0 0 22px #ff4d8822,inset 0 0 24px #ff4d8828}.result small{color:#ffe58b;letter-spacing:3px;font-weight:1000}.challenge{font-size:clamp(22px,5vw,36px);font-weight:1000;margin-top:7px;color:#fff;text-shadow:0 0 16px #ff4d88aa}.result.pop{animation:resultPop .65s cubic-bezier(.2,1.5,.4,1)}@keyframes resultPop{0%{transform:scale(.85);filter:brightness(1)}55%{transform:scale(1.06);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1)}}
.result small{color:var(--gold);letter-spacing:3px;font-weight:800}.challenge{font-size:clamp(22px,5vw,36px);font-weight:900;margin-top:6px;color:#fff}.hint{font-size:13px;color:#d9c9f5;line-height:1.6;margin-top:14px}.hint b{color:#ffe58b}.status{font-size:12px;color:#a9dff2;margin-top:10px;font-weight:700}.confetti{position:fixed;z-index:10;top:-20px;width:9px;height:15px;border-radius:2px;pointer-events:none;animation:confettiFall 2.3s ease-in forwards}@keyframes confettiFall{to{transform:translate(var(--drift),105vh) rotate(900deg);opacity:0}}
.status{font-size:12px;color:#9cb5ca;margin-top:10px}
@media(max-width:480px){body{padding:10px}.wheel-wrap{width:min(88vw,390px)}button{padding:13px 24px}}
</style>
</head>
<body>
<main>
<div class="tag">SMOKE AFTER DARK</div>
<div class="tag battle-tag">⚠ LIVE BATTLE CHALLENGE ⚠</div>
<h1>WHEEL OF DOOM</h1>
<p class="sub">One spin. One challenge. No excuses.</p>
<div class="wheel-wrap"><div class="smoke-plume"></div><div class="flame-plume"></div><canvas id="fire" width="1000" height="1000" aria-hidden="true"></canvas><div class="pointer"></div><canvas id="wheel" width="900" height="900"></canvas><div class="hub"></div></div>
<button id="spin">SPIN THE WHEEL</button>
<section class="result" aria-live="polite"><small>YOUR DOOM IS…</small><div class="challenge" id="challenge">Waiting for the first spin…</div></section>
<div class="hint">TikTok chat: type <b>!spin</b> to spin the wheel · <b>!help</b> for instructions<br>Streamer can also press the spin button.</div>
<div class="status" id="status">Waiting for a TikTok battle to begin…</div>
</main>
<script>
const challenges=[
"Talk like a pirate for 2 minutes 🏴‍☠️",
"Sing your next sentence 🎤",
"Do your best evil villain laugh 😈",
"No saying the word “I” for 2 minutes 🤐",
"Give the next player a dramatic compliment 👑",
"Do 10 seconds of your victory dance 💃",
"Speak in a robot voice until your next turn 🤖",
"Let chat choose your battle nickname ✍️",
" narrate your next move like a sports commentator 🎙️",
"Do your best movie-trailer voice 🎬",
"Say the alphabet backwards as far as you can 🔤",
"Play your next turn with your non-dominant hand ✋",
"Give a 10-second acceptance speech 🏆",
"Whisper dramatically for one full minute 🤫",
"Make up a theme song for your opponent 🎶",
"Do your best impression of a game show host 📺"
];
const colors=["#641b18","#9e2d16","#302a2a","#7a1717","#b34a16","#3b171c","#85301b","#211b20"];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spinBtn=document.getElementById('spin');
const TAU=Math.PI*2,arc=TAU/challenges.length;
let rotation=0,spinning=false,lastIndex=-1,chatSocket=null,lastChatSpin=0,battleActive=false,battleDuration=300,battleStartAt=0,popupShown=false,autoSpun=false,lastBattleKey="";
function draw(){
 const cx=450,cy=450,r=420;ctx.clearRect(0,0,900,900);ctx.save();ctx.shadowColor='#ff4a12';ctx.shadowBlur=12;
 challenges.forEach((label,i)=>{
  const start=rotation+i*arc-Math.PI/2,end=start+arc;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();const grad=ctx.createRadialGradient(cx-80,cy-90,20,cx,cy,r);grad.addColorStop(0,colors[i%colors.length]);grad.addColorStop(1,i%2?'#090909':'#24100d');ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle='#b98b68';ctx.lineWidth=3;ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(start+arc/2);ctx.textAlign="right";ctx.fillStyle="#fff";ctx.shadowColor="#071020";ctx.shadowBlur=5;
  const words=label.replace(/\s+/g," ").split(" ");let lines=[],line="";
  for(const word of words){if((line+" "+word).trim().length>19){lines.push(line);line=word}else line=(line+" "+word).trim()}if(line)lines.push(line);
  ctx.font="1000 22px system-ui";const x=r-32;const total=lines.length*26;lines.forEach((txt,j)=>ctx.fillText(txt,x,-total/2+20+j*26));ctx.restore();
 });
 ctx.restore();ctx.beginPath();ctx.arc(cx,cy,r-7,0,TAU);ctx.strokeStyle='#d77a31';ctx.lineWidth=15;ctx.shadowColor='#ff3b0b';ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(cx,cy,105,0,TAU);ctx.strokeStyle='#2a1713';ctx.lineWidth=9;ctx.stroke();
}

// A separate animated fire layer: constantly changing flame tongues, sparks and glowing embers.
const fireCanvas=document.getElementById('fire'),fireCtx=fireCanvas.getContext('2d');
const fireParticles=[],embers=[];
function spawnFlame(){
 const a=Math.random()*TAU,rad=445,life=24+Math.random()*30;
 fireParticles.push({x:500+Math.cos(a)*rad,y:500+Math.sin(a)*rad,life,max:life,vx:(Math.random()-.5)*1.2-.15,vy:-1.8-Math.random()*3.1,w:5+Math.random()*13,h:30+Math.random()*62,phase:Math.random()*TAU});
}
function spawnEmber(){
 const a=Math.random()*TAU,rad=440;
 embers.push({x:500+Math.cos(a)*rad,y:500+Math.sin(a)*rad,vx:(Math.random()-.5)*2.8,vy:-1-Math.random()*3.5,life:25+Math.random()*45,size:1+Math.random()*3});
}
function animateFire(){
 fireCtx.clearRect(0,0,1000,1000);
 for(let k=0;k<5;k++)spawnFlame();
 if(Math.random()<.8)spawnEmber();
 for(let i=fireParticles.length-1;i>=0;i--){
  const p=fireParticles[i];p.life--;p.x+=p.vx+Math.sin(p.phase+p.life*.12)*.65;p.y+=p.vy;p.w*=.987;
  const fade=Math.min(1,p.life/12),height=p.h*(1-p.life/p.max*.35);
  fireCtx.save();fireCtx.globalAlpha=Math.min(1,fade*.92);fireCtx.translate(p.x,p.y);fireCtx.rotate(Math.sin(p.phase+p.life*.1)*.18);
  const g=fireCtx.createLinearGradient(0,0,0,-height);g.addColorStop(0,'#fff4a6');g.addColorStop(.18,'#ffc02f');g.addColorStop(.48,'#ff5a12');g.addColorStop(1,'rgba(135,18,5,0)');
  fireCtx.fillStyle=g;fireCtx.shadowColor='#ff4a0a';fireCtx.shadowBlur=15;
  fireCtx.beginPath();fireCtx.moveTo(-p.w*.55,0);fireCtx.bezierCurveTo(-p.w*1.25,-height*.25,-p.w*.28,-height*.72,0,-height);fireCtx.bezierCurveTo(p.w*.38,-height*.7,p.w*1.2,-height*.24,p.w*.55,0);fireCtx.closePath();fireCtx.fill();
  fireCtx.restore();if(p.life<=0)fireParticles.splice(i,1);
 }
 for(let i=embers.length-1;i>=0;i--){
  const e=embers[i];e.life--;e.x+=e.vx;e.y+=e.vy;e.vy-=.015;
  fireCtx.globalAlpha=Math.min(1,e.life/12);fireCtx.fillStyle='#ffbd48';fireCtx.shadowColor='#ff5a12';fireCtx.shadowBlur=10;fireCtx.beginPath();fireCtx.arc(e.x,e.y,e.size,0,TAU);fireCtx.fill();
  if(e.life<=0)embers.splice(i,1);
 }
 fireCtx.globalAlpha=1;fireCtx.shadowBlur=0;requestAnimationFrame(animateFire);
}
animateFire();
function confettiBurst(){const palette=['#ff4d88','#ffe58b','#65e9f2','#a76bff','#70ffbd'];for(let i=0;i<65;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=(Math.random()*100)+'vw';bit.style.background=palette[i%palette.length];bit.style.setProperty('--drift',(Math.random()*240-120)+'px');bit.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(bit);setTimeout(()=>bit.remove(),2800)}}
function spin(){
 if(spinning)return;
 spinning=true;spinBtn.disabled=true;document.getElementById('status').textContent="The wheel is spinning…";
 let index;do{index=Math.floor(Math.random()*challenges.length)}while(index===lastIndex);
 lastIndex=index;
 // Pointer is at the top; center of selected segment is aligned with it after the rotation.
 const current=((rotation%TAU)+TAU)%TAU;
 const target=((-(index+.5)*arc-current)%TAU+TAU)%TAU;
 const extra=TAU*(5+Math.floor(Math.random()*3));
 const from=rotation,to=rotation+extra+target,duration=5200,start=performance.now();
 function frame(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);rotation=from+(to-from)*ease;draw();if(t<1)requestAnimationFrame(frame);else{rotation=((to%TAU)+TAU)%TAU;draw();document.getElementById('challenge').textContent=challenges[index];const result=document.querySelector('.result');result.classList.remove('pop');void result.offsetWidth;result.classList.add('pop');confettiBurst();document.getElementById('status').textContent="🎉 Challenge selected · Good luck!";spinning=false;spinBtn.disabled=false}}
 requestAnimationFrame(frame);
}
spinBtn.addEventListener('click',spin);draw();
// Normal link opens as a visible preview; add ?live=1 for the hidden-until-battle LIVE overlay.
if(new URLSearchParams(window.location.search).get('live')==='1')document.body.classList.add('live-mode');
function showWheel(){if(popupShown)return;popupShown=true;document.body.classList.add('active');document.getElementById('status').textContent="The battle challenge is live!";}
function resetBattle(){battleActive=false;popupShown=false;autoSpun=false;document.body.classList.remove('active');document.getElementById('challenge').textContent="Waiting for the next battle…";document.getElementById('status').textContent="Battle ended · Waiting for the next TikTok battle.";}
function beginBattle(data){
 const duration=Number(data.battleDuration||data.durationSec||300);
 battleDuration=duration>0?duration:300;battleStartAt=Date.now();battleActive=true;popupShown=false;autoSpun=false;
 document.body.classList.remove('active');document.getElementById('challenge').textContent="Challenge will be revealed near the end…";
 document.getElementById('status').textContent="Battle detected · Wheel appears after 1 minute.";
}
function updateBattleClock(data){
 if(!battleActive){const duration=Number(data.durationSec||data.battleDuration||300);battleDuration=duration>0?duration:300;battleStartAt=Date.now()-Math.max(0,battleDuration-Number(data.secsRemaining||battleDuration))*1000;battleActive=true;}
 const remaining=Number(data.secsRemaining);
 if(Number.isFinite(remaining)){
  const elapsed=Math.max(0,battleDuration-remaining);
  if(elapsed>=60)showWheel();
  if(remaining<=30&&remaining>=0&&!autoSpun){showWheel();autoSpun=true;document.getElementById('status').textContent="FINAL 30 SECONDS — your challenge is being chosen!";spin();}
  if(remaining<=0)resetBattle();
 }
}
function handleBattleEvent(event,data){
 if(event==="battle"){
  const status=Number(data.status),key=String(data.battleId||data.matchId||"");
  if(status===1){if(!battleActive||!key||key!==lastBattleKey){lastBattleKey=key;beginBattle(data)}}
  else if(status===3){resetBattle();lastBattleKey=""}
 }else if(event==="battleArmies"){
  const status=Number(data.status);
  if(status===1||status===4||status===2){if(data.matchId)lastBattleKey=String(data.matchId);updateBattleClock(data);if(status===2&&Number(data.secsRemaining)===0)resetBattle()}
 }
}
function tickBattle(){
 if(!battleActive)return;
 const elapsed=(Date.now()-battleStartAt)/1000;
 if(elapsed>=60)showWheel();
 if(battleDuration-elapsed<=30&&!autoSpun){showWheel();autoSpun=true;document.getElementById('status').textContent="FINAL 30 SECONDS — your challenge is being chosen!";spin();}
 if(elapsed>=battleDuration){resetBattle();lastBattleKey=""}
}
setInterval(tickBattle,500);
function handleChat(data){
 const msg=String(data.comment||data.content||"").trim(),who=data.user?.nickname||data.nickname||data.user?.uniqueId||"Viewer";
 if(/^!help$/i.test(msg)){document.getElementById('status').textContent=who+": type !spin to trigger a random challenge.";return}
 if(/^!spin$/i.test(msg)){const now=Date.now();if(now-lastChatSpin<7000)return;lastChatSpin=now;document.getElementById('status').textContent=who+" called the Wheel of Doom!";spin()}
}
function connectChat(){
 try{chatSocket=new WebSocket("ws://localhost:21213/");chatSocket.onopen=()=>document.getElementById('status').textContent="TikFinity connected · Chat can use !spin";chatSocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="chat")handleChat(m.data||{});else if(m.event==="battle"||m.event==="battleArmies")handleBattleEvent(m.event,m.data||{})}catch(_){}};chatSocket.onclose=()=>{document.getElementById('status').textContent="TikFinity not connected · Button still works";setTimeout(connectChat,5000)};chatSocket.onerror=()=>{document.getElementById('status').textContent="Open TikFinity Desktop on this PC · Button still works"}}catch(_){}
}
connectChat();
</script>
</body></html>
