<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHEEL OF DOOM — TikTok LIVE</title>
<style>
:root{color-scheme:dark;--cyan:#65e9f2;--pink:#ff4d88;--gold:#ffd36e;--inferno:#a82b12;--antique:#d8a65a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#08060638,#08060677),url("https://images.openai.com/static-rsc-4/lgH2QseUR-IxworBpSkZnMqkXPDUhwnn2ddJRFIb-O-zvHWhB9iUa2uEj2B5V6nnOW0cfcUknM0A4oWctpBuL_xIGJl4HqHXJJKOb7q5NbTX55Di_Th8sFJ44fJcmwKVy6TiOCwdYZSNsLPocgAsBYYOBEjAZMrVYV8RY3sPE6M?purpose=inline") center center/cover fixed no-repeat;color:#fff4dc;font:16px Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:16px;overflow-x:hidden;overflow-y:auto}
main{position:relative;isolation:isolate;width:min(100%,780px);text-align:center;padding:22px 18px 18px;border:1px solid #c18a4c66;border-radius:8px;background:linear-gradient(145deg,#10080755,#16090744 55%,#08050566);box-shadow:0 18px 55px #0009,inset 0 0 45px #a12a1412;backdrop-filter:blur(2px);opacity:1;visibility:visible;transform:translateY(0) scale(1);transition:opacity .7s ease,transform .7s ease,visibility .7s}to{transform:translate(12px,-10px) scale(1.05)}}.live-mode main{opacity:0;visibility:hidden;transform:translateY(24px) scale(.96)}.live-mode.active main{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.tag{display:block;width:max-content;max-width:100%;margin:0 auto 8px;color:#f6d79d;letter-spacing:4px;font-weight:1000;font-size:12px;padding:8px 18px;border:1px solid #a36d3b;border-radius:2px;background:linear-gradient(90deg,#1b0b09,#4a1b12,#1b0b09);text-shadow:0 2px 7px #000;box-shadow:inset 0 0 15px #c65a1c33}.battle-tag{color:#ffd8ad;border-color:#a65c35;background:#38251c}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,8vw,68px);line-height:.98;margin:12px 0;color:#f8d58b;letter-spacing:1px;text-transform:uppercase;-webkit-text-stroke:1px #5a230f;text-shadow:0 2px 0 #5a210d,0 4px 0 #1b0906,0 0 12px #ff8b2b99,0 8px 20px #000}.sub{position:relative;z-index:5;display:table;margin:0 auto 16px;padding:5px 14px;color:#ffe0ad;font-weight:700;font-style:italic;text-shadow:0 2px 4px #000,0 0 10px #000;background:linear-gradient(90deg,transparent,#160a08dd 18%,#160a08dd 82%,transparent);border-radius:4px}
.wheel-wrap{width:min(78vw,470px);aspect-ratio:1;margin:34px auto 26px;position:relative;filter:drop-shadow(0 18px 28px #000) drop-shadow(0 0 18px #a52b10)}.wheel-wrap:before{content:"";position:absolute;inset:-17px;border-radius:50%;border:10px ridge #b8874d;box-shadow:0 0 0 4px #1b0907,0 0 0 7px #6e351e,0 0 28px #ff6a1b99,inset 0 0 20px #000;pointer-events:none;z-index:2}.wheel-wrap:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid #f2c879;box-shadow:inset 0 0 12px #ff9b36,0 0 12px #ff6a1b;pointer-events:none;z-index:2}.smoke-plume,.flame-plume{position:absolute;z-index:0;inset:-48px;border-radius:50%;pointer-events:none}@keyframes fireRotate{to{transform:rotate(360deg)}}
#fire{position:absolute;z-index:2;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);pointer-events:none;overflow:hidden}.pointer{z-index:4}.hub{z-index:3}@keyframes orbit{to{transform:rotate(360deg)}}
canvas{position:relative;z-index:1;width:100%;height:100%;display:block;border-radius:50%}
.pointer{position:absolute;z-index:2;top:-17px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:0;border-bottom:54px solid #f6d58c;filter:drop-shadow(0 0 8px #ff8a2c) drop-shadow(0 4px 4px #000)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 36% 28%,#f8dca0,#a96a32 28%,#3b1710 67%,#100807 100%);border:7px double #e5bd72;box-shadow:0 0 0 4px #38160e,0 0 22px #ff641e99,inset 0 0 16px #000;pointer-events:none}.hub:after{content:'☠';font:clamp(26px,6vw,42px) Georgia,serif;color:#f6d18b;text-shadow:0 2px 2px #210904,0 0 10px #ff6b20}
button{font:1000 16px Georgia,'Times New Roman',serif;letter-spacing:2px;border:2px solid #e3b66b;border-radius:3px;padding:15px 32px;background:linear-gradient(180deg,#a83b19,#4c160e 55%,#210b08);color:#ffe4ad;text-shadow:0 2px 4px #210904;box-shadow:0 5px 0 #1c0907,0 8px 22px #000b,inset 0 0 18px #ff9b342e;cursor:pointer;animation:buttonGlow 2s ease-in-out infinite alternate;transition:transform .15s}button:hover{transform:translateY(-3px) scale(1.03)}button:disabled{opacity:.5;cursor:wait;animation:none}@keyframes buttonGlow{to{box-shadow:0 5px 0 #35271f,0 10px 22px #000b}}
.result{min-height:96px;margin:18px auto 12px;padding:17px;border:1px solid #a76a3d;border-radius:4px;background:linear-gradient(140deg,#3a1712ee,#100a09ee);max-width:640px;box-shadow:0 0 22px #e34b1622,inset 0 0 24px #a62b1428}.result small{color:#ffe58b;letter-spacing:3px;font-weight:1000}.challenge{font-family:Georgia,'Times New Roman',serif;font-size:clamp(22px,5vw,36px);font-weight:1000;margin-top:7px;color:#ffe0a0;text-shadow:0 0 16px #ff5a1aaa,0 2px 4px #000}.result.pop{animation:resultPop .65s cubic-bezier(.2,1.5,.4,1)}@keyframes resultPop{0%{transform:scale(.85);filter:brightness(1)}55%{transform:scale(1.06);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1)}}
.result small{color:var(--gold);letter-spacing:3px;font-weight:800}.challenge{font-size:clamp(22px,5vw,36px);font-weight:900;margin-top:6px;color:#fff}.hint{font-size:13px;color:#d9c9f5;line-height:1.6;margin-top:14px}.hint b{color:#ffe58b}.status{font-size:12px;color:#a9dff2;margin-top:10px;font-weight:700}.fire-confetti{position:fixed;z-index:10;top:-35px;line-height:1;pointer-events:none;filter:drop-shadow(0 0 5px #ff6a16) drop-shadow(0 0 10px #ffb52e);animation:fireRain 2.6s ease-in forwards}@keyframes fireRain{0%{transform:translate3d(0,-4vh,0) rotate(-18deg) scale(.7);opacity:0}12%{opacity:1}55%{transform:translate3d(calc(var(--drift)*.55),55vh,0) rotate(170deg) scale(1.12);opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(390deg) scale(.65);opacity:0}}
.status{font-size:12px;color:#9cb5ca;margin-top:10px}
.popup{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:#050303df;backdrop-filter:blur(8px)}.popup[hidden]{display:none}.popup-card{width:min(100%,560px);padding:30px 24px 26px;text-align:center;border:3px ridge #d8a65a;border-radius:8px;background:radial-gradient(ellipse at top,#652515,#1b0907 62%,#080505);box-shadow:0 0 0 5px #210b08,0 0 55px #ff4b16aa,inset 0 0 35px #ff6b1c33;animation:popupReveal .45s cubic-bezier(.2,1.5,.4,1)}.popup-skull{font-size:54px;color:#f6d58c;text-shadow:0 0 20px #ff6a1b}.popup-kicker{margin:8px 0 16px;color:#ffd36e;font-size:clamp(14px,3vw,19px);font-weight:1000;letter-spacing:4px}.popup-challenge{font:1000 clamp(27px,6vw,46px)/1.15 Georgia,Times New Roman,serif;color:#fff0c8;text-shadow:0 0 18px #ff5419,0 3px 5px #000;margin:0 auto 25px}@keyframes popupReveal{from{opacity:0;transform:scale(.72) rotate(-3deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@media(max-width:480px){body{padding:10px}.wheel-wrap{width:min(88vw,390px)}button{padding:13px 24px}}
</style>
</head>
<body>
<main>
<div class="tag">SMOKE AFTER DARK</div>
<div class="tag battle-tag">⚠ LIVE BATTLE CHALLENGE ⚠</div>
<h1>WHEEL OF DOOM</h1>
<div class="wheel-wrap"><canvas id="fire" width="1000" height="1000" aria-hidden="true"></canvas><div class="pointer"></div><canvas id="wheel" width="900" height="900"></canvas><div class="hub"></div></div>
<button id="spin">SPIN THE WHEEL</button>
<section class="result" aria-live="polite"><small>YOUR DOOM IS…</small><div class="challenge" id="challenge">Waiting for the first spin…</div></section>
<div class="hint">TikTok chat: type <b>!spin</b> to spin the wheel · <b>!help</b> for instructions<br>Streamer can also press the spin button.</div>
<div class="status" id="status">Waiting for a TikTok battle to begin…</div>
</main>
<div id="challengePopup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle" hidden><div class="popup-card"><div class="popup-skull">☠</div><div class="popup-kicker" id="popupTitle">THE WHEEL HAS SPOKEN</div><div class="popup-challenge" id="popupChallenge"></div><button type="button" id="closePopup">GOT IT</button></div></div>
<script>
const challenges=[
"Talk like a pirate for 2 minutes 🏴‍☠️",
"Sing your next sentence 🎤",
"Do your best evil villain laugh 😈",
"No saying the word “I” for 2 minutes 🤐",
"Give the next player a dramatic compliment 👑",
"Do 10 seconds of your victory dance 💃",
"Speak in a robot voice until your next turn 🤖",
"Let chat choose your battle nickname ✍️",
" narrate your next move like a sports commentator 🎙️",
"Do your best movie-trailer voice 🎬",
"Say the alphabet backwards as far as you can 🔤",
"Play your next turn with your non-dominant hand ✋",
"Give a 10-second acceptance speech 🏆",
"Whisper dramatically for one full minute 🤫",
"Make up a theme song for your opponent 🎶",
"Do your best impression of a game show host 📺"
];
const colors=["#4a100d","#a42b13","#24100e","#76180f","#bd4b16","#32100d","#8c3218","#160b0a"];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spinBtn=document.getElementById('spin');
const TAU=Math.PI*2,arc=TAU/challenges.length;
let rotation=0,spinning=false,lastIndex=-1,chatSocket=null,lastChatSpin=0,battleActive=false,battleDuration=300,battleStartAt=0,popupShown=false,autoSpun=false,lastBattleKey="";
function draw(){
 const cx=450,cy=450,r=420;ctx.clearRect(0,0,900,900);ctx.save();ctx.shadowColor='#ff4a12';ctx.shadowBlur=12;
 challenges.forEach((label,i)=>{
  const start=rotation+i*arc-Math.PI/2,end=start+arc;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();const grad=ctx.createRadialGradient(cx-80,cy-90,20,cx,cy,r);grad.addColorStop(0,colors[i%colors.length]);grad.addColorStop(1,i%2?'#090909':'#24100d');ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle='#c49350';ctx.lineWidth=4;ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(start+arc/2);ctx.textAlign="right";ctx.fillStyle="#fff";ctx.shadowColor="#071020";ctx.shadowBlur=5;
  const words=label.replace(/\s+/g," ").split(" ");let lines=[],line="";
  for(const word of words){if((line+" "+word).trim().length>19){lines.push(line);line=word}else line=(line+" "+word).trim()}if(line)lines.push(line);
  ctx.font="1000 22px system-ui";const x=r-32;const total=lines.length*26;lines.forEach((txt,j)=>ctx.fillText(txt,x,-total/2+20+j*26));ctx.restore();
 });
 ctx.restore();ctx.beginPath();ctx.arc(cx,cy,r-7,0,TAU);ctx.strokeStyle='#d5a45c';ctx.lineWidth=18;ctx.shadowColor='#ff3b0b';ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(cx,cy,105,0,TAU);ctx.strokeStyle='#d6a65f';ctx.lineWidth=11;ctx.stroke();
}

// A single continuous inferno: turbulent fire tongues erupt from the rim all the way around.
const fireCanvas=document.getElementById('fire'),fireCtx=fireCanvas.getContext('2d');
let fireTime=0;
const TAU_FIRE=Math.PI*2;
const flameSeeds=Array.from({length:58},(_,i)=>({
 angle:i/58*TAU_FIRE+(Math.random()-.5)*.075,
 height:58+Math.random()*74,
 width:.035+Math.random()*.045,
 speed:.7+Math.random()*1.4,
 phase:Math.random()*TAU_FIRE
}));
function flamePoint(a,r){return {x:500+Math.cos(a)*r,y:500+Math.sin(a)*r};}
function drawTongue(seed,index,layer){
 const flicker=.72+.28*Math.sin(fireTime*seed.speed+seed.phase);
 const sway=Math.sin(fireTime*(1.1+seed.speed*.25)+seed.phase)*.025;
 const h=seed.height*flicker*layer;
 const a=seed.angle+sway;
 const base=flamePoint(a,438);
 const left=flamePoint(a-seed.width,445);
 const right=flamePoint(a+seed.width,445);
 const tip=flamePoint(a+Math.sin(fireTime*seed.speed+seed.phase)*.018,455+h);
 const lobeL=flamePoint(a-seed.width*.48,455+h*.58);
 const lobeR=flamePoint(a+seed.width*.48,455+h*.62);
 const grad=fireCtx.createRadialGradient(tip.x,tip.y,1,base.x,base.y,h+42);
 grad.addColorStop(0,layer>1?'rgba(255,235,105,.72)':'rgba(255,245,160,.95)');
 grad.addColorStop(.28,'rgba(255,174,31,.96)');
 grad.addColorStop(.68,'rgba(255,73,8,.9)');
 grad.addColorStop(1,'rgba(155,13,0,0)');
 fireCtx.beginPath();fireCtx.moveTo(left.x,left.y);
 fireCtx.quadraticCurveTo(lobeL.x,lobeL.y,tip.x,tip.y);
 fireCtx.quadraticCurveTo(lobeR.x,lobeR.y,right.x,right.y);
 fireCtx.closePath();fireCtx.fillStyle=grad;
 fireCtx.shadowColor=layer>1?'#ff6a0a':'#ff3100';fireCtx.shadowBlur=layer>1?23:34;fireCtx.fill();
}
function drawFireRing(inner,outer,phase,fillStyle,alpha){
 fireCtx.save();fireCtx.globalAlpha=alpha;fireCtx.beginPath();
 for(let i=0;i<=300;i++){
  const a=i/300*TAU_FIRE+phase;
  const r=outer+Math.sin(a*9+fireTime*2)*5+Math.sin(a*17-fireTime*2.8)*3;
  const p=flamePoint(a,r);if(i===0)fireCtx.moveTo(p.x,p.y);else fireCtx.lineTo(p.x,p.y);
 }
 for(let i=300;i>=0;i--){const a=i/300*TAU_FIRE+phase;const p=flamePoint(a,inner+Math.sin(a*8-fireTime*1.7)*3);fireCtx.lineTo(p.x,p.y);}
 fireCtx.closePath();fireCtx.fillStyle=fillStyle;fireCtx.shadowColor='#ff3c00';fireCtx.shadowBlur=32;fireCtx.fill();fireCtx.restore();
}
function animateFire(){
 fireCtx.clearRect(0,0,1000,1000);fireTime+=.035;
 // Build the connected burning base first, so the individual tongues merge into one eruption.
 const base=fireCtx.createRadialGradient(500,500,426,500,500,500);
 base.addColorStop(0,'rgba(255,239,116,0)');base.addColorStop(.23,'rgba(255,231,104,.98)');
 base.addColorStop(.42,'rgba(255,125,15,.98)');base.addColorStop(.75,'rgba(245,47,4,.88)');base.addColorStop(1,'rgba(105,8,0,0)');
 drawFireRing(426,492,0,base,.98);
 // Two staggered layers create depth, heat shimmer and a real flame silhouette.
 fireCtx.save();fireCtx.globalCompositeOperation='screen';
 flameSeeds.forEach((seed,i)=>drawTongue(seed,i,1));
 flameSeeds.forEach((seed,i)=>{if(i%2===0)drawTongue({...seed,angle:seed.angle+.045,height:seed.height*.72,phase:seed.phase+1.4},i,1.25)});
 fireCtx.restore();
 // A molten white-gold line at the wheel edge makes the fire feel intensely hot.
 const core=fireCtx.createRadialGradient(500,500,432,500,500,468);
 core.addColorStop(0,'rgba(255,255,180,0)');core.addColorStop(.45,'rgba(255,245,147,.95)');
 core.addColorStop(.76,'rgba(255,156,30,.78)');core.addColorStop(1,'rgba(255,80,0,0)');
 drawFireRing(433,466,fireTime*.012,core,.82);
 // Sparks shoot outward from the same continuous flame front.
 for(let i=0;i<30;i++){
  const a=(i/30)*TAU_FIRE+fireTime*(.16+(i%4)*.018);
  const r=492+((fireTime*21+i*37)%66);
  const p=flamePoint(a,r);
  fireCtx.globalAlpha=.25+.7*(.5+.5*Math.sin(fireTime*5+i));
  fireCtx.fillStyle=i%4===0?'#fff5b2':'#ff9b28';fireCtx.shadowColor='#ff4a08';fireCtx.shadowBlur=15;
  fireCtx.beginPath();fireCtx.arc(p.x,p.y,1.4+(i%3),0,TAU_FIRE);fireCtx.fill();
 }
 fireCtx.globalAlpha=1;fireCtx.shadowBlur=0;requestAnimationFrame(animateFire);
}
animateFire();
function confettiBurst(){for(let i=0;i<55;i++){const bit=document.createElement('span');bit.className='fire-confetti';bit.textContent='🔥';bit.style.left=(Math.random()*100)+'vw';bit.style.fontSize=(14+Math.random()*17)+'px';bit.style.setProperty('--drift',(Math.random()*260-130)+'px');bit.style.animationDuration=(2.1+Math.random()*1.3)+'s';bit.style.animationDelay=(Math.random()*.55)+'s';document.body.appendChild(bit);setTimeout(()=>bit.remove(),4100)}}
function spin(){
 if(spinning)return;
 spinning=true;spinBtn.disabled=true;document.getElementById('status').textContent="The wheel is spinning…";
 let index;do{index=Math.floor(Math.random()*challenges.length)}while(index===lastIndex);
 lastIndex=index;
 // Pointer is at the top; center of selected segment is aligned with it after the rotation.
 const current=((rotation%TAU)+TAU)%TAU;
 const target=((-(index+.5)*arc-current)%TAU+TAU)%TAU;
 const extra=TAU*(5+Math.floor(Math.random()*3));
 const from=rotation,to=rotation+extra+target,duration=5200,start=performance.now();
 function frame(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);rotation=from+(to-from)*ease;draw();if(t<1)requestAnimationFrame(frame);else{rotation=((to%TAU)+TAU)%TAU;draw();document.getElementById('challenge').textContent=challenges[index];document.getElementById('popupChallenge').textContent=challenges[index];document.getElementById('challengePopup').hidden=false;const result=document.querySelector('.result');result.classList.remove('pop');void result.offsetWidth;result.classList.add('pop');confettiBurst();document.getElementById('status').textContent="🎉 Challenge selected · Good luck!";spinning=false;spinBtn.disabled=false}}
 requestAnimationFrame(frame);
}
spinBtn.addEventListener('click',spin);document.getElementById('closePopup').addEventListener('click',()=>{document.getElementById('challengePopup').hidden=true});document.getElementById('challengePopup').addEventListener('click',e=>{if(e.target.id==='challengePopup')e.currentTarget.hidden=true});draw();
// Normal link opens as a visible preview; add ?live=1 for the hidden-until-battle LIVE overlay.
if(new URLSearchParams(window.location.search).get('live')==='1')document.body.classList.add('live-mode');
function showWheel(){if(popupShown)return;popupShown=true;document.body.classList.add('active');document.getElementById('status').textContent="The battle challenge is live!";}
function resetBattle(){battleActive=false;popupShown=false;autoSpun=false;document.body.classList.remove('active');document.getElementById('challenge').textContent="Waiting for the next battle…";document.getElementById('status').textContent="Battle ended · Waiting for the next TikTok battle.";}
function beginBattle(data){
 const duration=Number(data.battleDuration||data.durationSec||300);
 battleDuration=duration>0?duration:300;battleStartAt=Date.now();battleActive=true;popupShown=false;autoSpun=false;
 document.body.classList.remove('active');document.getElementById('challenge').textContent="Challenge will be revealed near the end…";
 document.getElementById('status').textContent="Battle detected · Wheel appears after 1 minute.";
}
function updateBattleClock(data){
 if(!battleActive){const duration=Number(data.durationSec||data.battleDuration||300);battleDuration=duration>0?duration:300;battleStartAt=Date.now()-Math.max(0,battleDuration-Number(data.secsRemaining||battleDuration))*1000;battleActive=true;}
 const remaining=Number(data.secsRemaining);
 if(Number.isFinite(remaining)){
  const elapsed=Math.max(0,battleDuration-remaining);
  if(elapsed>=60)showWheel();
  if(remaining<=30&&remaining>=0&&!autoSpun){showWheel();autoSpun=true;document.getElementById('status').textContent="FINAL 30 SECONDS — your challenge is being chosen!";spin();}
  if(remaining<=0)resetBattle();
 }
}
function handleBattleEvent(event,data){
 if(event==="battle"){
  const status=Number(data.status),key=String(data.battleId||data.matchId||"");
  if(status===1){if(!battleActive||!key||key!==lastBattleKey){lastBattleKey=key;beginBattle(data)}}
  else if(status===3){resetBattle();lastBattleKey=""}
 }else if(event==="battleArmies"){
  const status=Number(data.status);
  if(status===1||status===4||status===2){if(data.matchId)lastBattleKey=String(data.matchId);updateBattleClock(data);if(status===2&&Number(data.secsRemaining)===0)resetBattle()}
 }
}
function tickBattle(){
 if(!battleActive)return;
 const elapsed=(Date.now()-battleStartAt)/1000;
 if(elapsed>=60)showWheel();
 if(battleDuration-elapsed<=30&&!autoSpun){showWheel();autoSpun=true;document.getElementById('status').textContent="FINAL 30 SECONDS — your challenge is being chosen!";spin();}
 if(elapsed>=battleDuration){resetBattle();lastBattleKey=""}
}
setInterval(tickBattle,500);
function handleChat(data){
 const msg=String(data.comment||data.content||"").trim(),who=data.user?.nickname||data.nickname||data.user?.uniqueId||"Viewer";
 if(/^!help$/i.test(msg)){document.getElementById('status').textContent=who+": type !spin to trigger a random challenge.";return}
 if(/^!spin$/i.test(msg)){const now=Date.now();if(now-lastChatSpin<7000)return;lastChatSpin=now;document.getElementById('status').textContent=who+" called the Wheel of Doom!";spin()}
}
function connectChat(){
 try{chatSocket=new WebSocket("ws://localhost:21213/");chatSocket.onopen=()=>document.getElementById('status').textContent="TikFinity connected · Chat can use !spin";chatSocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="chat")handleChat(m.data||{});else if(m.event==="battle"||m.event==="battleArmies")handleBattleEvent(m.event,m.data||{})}catch(_){}};chatSocket.onclose=()=>{document.getElementById('status').textContent="TikFinity not connected · Button still works";setTimeout(connectChat,5000)};chatSocket.onerror=()=>{document.getElementById('status').textContent="Open TikFinity Desktop on this PC · Button still works"}}catch(_){}
}
connectChat();
</script>
</body></html>
