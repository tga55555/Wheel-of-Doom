ze:clamp(17px,3vw,26px);padding:clamp(16px,3vh,25px) clamp(38px,7vw,76px);position:relative;z-index:8}@keyframes popupReveal{0%{opacity:0;transform:scale(.35) rotate(-8deg)}65%{opacity:1;transform:scale(1.09) rotate(2deg)}82%{transform:scale(.97) rotate(-1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes challengeReveal{from{opacity:0;transform:translateY(18px) scale(.75);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}

<body>
<main>
<div class="tag">SMOKE AFTER DARK</div>
<div class="tag battle-tag">⚠ LIVE BATTLE CHALLENGE ⚠</div>
<h1>WHEEL OF DOOM</h1>
<div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="900" height="900"></canvas><div class="hub"></div></div>
<button id="spin">SPIN THE WHEEL</button>
<section class="result" aria-live="polite"><small>YOUR DOOM IS…</small><div class="challenge" id="challenge">Waiting for the first spin…</div></section>
<div class="hint">TikTok chat: type <b>!spin</b> to spin the wheel · <b>!help</b> for instructions<br>Streamer can also press the spin button.</div>
<div class="status" id="status">Waiting for a TikTok battle to begin…</div>
</main>
<div id="challengePopup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle" hidden><div class="popup-card"><div class="flame-confetti" id="flameConfetti" aria-hidden="true"></div><div class="popup-skull">☠</div><div class="popup-kicker" id="popupTitle">THE WHEEL HAS SPOKEN</div><div class="popup-challenge" id="popupChallenge"></div><button type="button" id="closePopup">GOT IT</button></div></div>
<script>
const challenges=[
"Talk like a pirate for 2 minutes 🏴‍☠️",
"Sing your next sentence 🎤",
"Do your best evil villain laugh 😈",
"No saying the word “I” for 2 minutes 🤐",
"Give the next player a dramatic compliment 👑",
"Do 10 seconds of your victory dance 💃",
"Speak in a robot voice until your next turn 🤖",
"Let chat choose your battle nickname ✍️",
" narrate your next move like a sports commentator 🎙️",
"Do your best movie-trailer voice 🎬",
"Say the alphabet backwards as far as you can 🔤",
"Play your next turn with your non-dominant hand ✋",
"Give a 10-second acceptance speech 🏆",
"Whisper dramatically for one full minute 🤫",
"Make up a theme song for your opponent 🎶",
"Do your best impression of a game show host 📺"
];
const colors=["#4a100d","#a42b13","#24100e","#76180f","#bd4b16","#32100d","#8c3218","#160b0a"];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spinBtn=document.getElementById('spin');
const TAU=Math.PI*2,arc=TAU/challenges.length;
let rotation=0,spinning=false,lastIndex=-1,chatSocket=null,lastChatSpin=0,battleActive=false,battleDuration=300,battleStartAt=0,popupShown=false,autoSpun=false,lastBattleKey="",pendingChallenge=null;
function draw(){
 const cx=450,cy=450,r=420;
 ctx.clearRect(0,0,900,900);
 // Charred iron wheel with ember-red segment faces and scorched bone trim.
 ctx.save();
 challenges.forEach((label,i)=>{
  const start=rotation+i*arc-Math.PI/2,end=start+arc,mid=start+arc/2;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();
  const grad=ctx.createRadialGradient(cx+Math.cos(mid)*55,cy+Math.sin(mid)*55,18,cx,cy,r);
  grad.addColorStop(0,i%3===0?'#3a1714':i%3===1?'#29110f':'#17100f');
  grad.addColorStop(.68,i%2?'#190b0b':'#35100d');
  grad.addColorStop(1,'#080606');
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='#8f633e';ctx.lineWidth=4;ctx.stroke();
  // Fine scorched-metal grain and ember seam in each wedge.
  ctx.save();ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-9,start,end);ctx.closePath();ctx.clip();
  ctx.strokeStyle='rgba(218,133,69,.16)';ctx.lineWidth=2;
  for(let k=0;k<5;k++){
   const rr=130+k*48;ctx.beginPath();ctx.arc(cx,cy,rr,start+.035,end-.035);ctx.stroke();
  }
  ctx.strokeStyle='rgba(177,44,24,.42)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx+Math.cos(mid)*125,cy+Math.sin(mid)*125);ctx.lineTo(cx+Math.cos(mid)*390,cy+Math.sin(mid)*390);ctx.stroke();
  // Small ember flecks, kept away from the challenge lettering.
  for(let k=0;k<7;k++){
   const ang=start+.12+(arc-.24)*(k/6),rr=365+(k%2)*15;
   ctx.fillStyle=k%2?'rgba(255,111,47,.7)':'rgba(220,171,105,.55)';
   ctx.beginPath();ctx.arc(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,2.2,0,TAU);ctx.fill();
  }
  ctx.restore();
  // Challenge lettering remains bright and readable.
  ctx.save();ctx.translate(cx,cy);ctx.rotate(mid);ctx.textAlign='right';
  ctx.fillStyle='#f4e4c9';ctx.shadowColor='#000';ctx.shadowBlur=7;
  const words=label.replace(/\\s+/g,' ').split(' ');let lines=[],line='';
  for(const word of words){if((line+' '+word).trim().length>19){lines.push(line);line=word}else line=(line+' '+word).trim()}
  if(line)lines.push(line);
  ctx.font='1000 22px system-ui';const x=r-32,total=lines.length*26;
  lines.forEach((txt,j)=>ctx.fillText(txt,x,-total/2+20+j*26));
  ctx.restore();
 });
 ctx.restore();
 // Heavy outer iron ring, inner bone-coloured pinstripe and engraved inner circle.
 ctx.beginPath();ctx.arc(cx,cy,r-7,0,TAU);ctx.strokeStyle='#160a08';ctx.lineWidth=28;ctx.stroke();
 ctx.beginPath();ctx.arc(cx,cy,r-8,0,TAU);ctx.strokeStyle='#b18a59';ctx.lineWidth=8;ctx.stroke();
 ctx.beginPath();ctx.arc(cx,cy,122,0,TAU);ctx.strokeStyle='#160806';ctx.lineWidth=20;ctx.stroke();
 ctx.beginPath();ctx.arc(cx,cy,111,0,TAU);ctx.strokeStyle='#c3a071';ctx.lineWidth=5;ctx.stroke();
 // Rivets around the outer rim.
 for(let i=0;i<32;i++){const ang=i*TAU/32;ctx.beginPath();ctx.arc(cx+Math.cos(ang)*(r-8),cy+Math.sin(ang)*(r-8),4,0,TAU);ctx.fillStyle='#d4b17c';ctx.fill();ctx.strokeStyle='#382016';ctx.lineWidth=2;ctx.stroke()}
}

function burstFlameConfetti(){
 const layer=document.getElementById('flameConfetti');if(!layer)return;layer.replaceChildren();
 for(let i=0;i<30;i++){
  const p=document.createElement('span');p.textContent='🔥';
  const angle=(Math.PI*2*i/30)+(Math.random()-.5)*.42;
  const distance=130+Math.random()*300;
  p.style.setProperty('--dx',(Math.cos(angle)*distance)+'px');
  p.style.setProperty('--dy',(Math.sin(angle)*distance*.72)+'px');
  p.style.setProperty('--rot',(Math.random()*300-150)+'deg');
  p.style.setProperty('--delay',(Math.random()*.18)+'s');
  layer.appendChild(p);
 }
}
function spin(deferPopup=false){
 if(spinning)return;
 spinning=true;spinBtn.disabled=true;document.getElementById('status').textContent="The wheel is spinning…";
 let index;do{index=Math.floor(Math.random()*challenges.length)}while(index===lastIndex);
 lastIndex=index;
 // Pointer is at the top; center of selected segment is aligned with it after the rotation.
 const current=((rotation%TAU)+TAU)%TAU;
 const target=((-(index+.5)*arc-current)%TAU+TAU)%TAU;
 const extra=TAU*(5+Math.floor(Math.random()*3));
 const from=rotation,to=rotation+extra+target,duration=5200,start=performance.now();
 function frame(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);rotation=from+(to-from)*ease;draw();if(t<1)requestAnimationFrame(frame);else{rotation=((to%TAU)+TAU)%TAU;draw();pendingChallenge=challenges[index];document.getElementById('challenge').textContent=pendingChallenge;document.getElementById('popupChallenge').textContent=pendingChallenge;if(!deferPopup)revealPendingChallenge();document.getElementById('status').textContent=deferPopup?"Challenge chosen · Starts with 30 seconds remaining.":"🎉 Challenge selected · Good luck!";spinning=false;spinBtn.disabled=false}}
 requestAnimationFrame(frame);
}
spinBtn.addEventListener('click',spin);function closeResultOverlay(){const p=document.getElementById('challengePopup');p.hidden=true;p.dataset.open='0';p.style.removeProperty('display');p.style.removeProperty('position');p.style.removeProperty('inset');p.style.removeProperty('width');p.style.removeProperty('height');p.style.removeProperty('z-index');p.style.removeProperty('align-items');p.style.removeProperty('justify-content');p.style.removeProperty('background');p.style.removeProperty('padding');}document.getElementById('closePopup').addEventListener('click',closeResultOverlay);document.getElementById('challengePopup').addEventListener('click',e=>{if(e.target.id==='challengePopup')closeResultOverlay()});draw();
// Normal link opens as a visible preview; add ?live=1 for the hidden-until-battle LIVE overlay.
if(new URLSearchParams(window.location.search).get('live')==='1')document.body.classList.add('live-mode');
function showWheel(){if(popupShown)return;popupShown=true;document.body.classList.add('active');document.getElementById('status').textContent="FINAL MINUTE — the Wheel of Doom is spinning!";}
function revealPendingChallenge(){
 const popup=document.getElementById('challengePopup');
 if(!pendingChallenge||!popup||popup.dataset.open==='1')return;
 document.getElementById('challenge').textContent=pendingChallenge;
 document.getElementById('popupChallenge').textContent=pendingChallenge;
 // Move the overlay to the top level and force full-viewport positioning,
 // so no wheel/container styling can clip or cover it.
 if(popup.parentElement!==document.body)document.body.appendChild(popup);
 popup.hidden=false;popup.dataset.open='1';
 popup.style.setProperty('position','fixed','important');
 popup.style.setProperty('inset','0','important');
 popup.style.setProperty('width','100vw','important');
 popup.style.setProperty('height','100vh','important');
 popup.style.setProperty('height','100dvh','important');
 popup.style.setProperty('z-index','2147483647','important');
 popup.style.setProperty('display','flex','important');
 popup.style.setProperty('align-items','center','important');
 popup.style.setProperty('justify-content','center','important');
 popup.style.setProperty('background','rgba(0,0,0,.995)','important');
 popup.style.setProperty('padding','2vh 2vw','important');
 const card=popup.querySelector('.popup-card');
 card.style.setProperty('width','min(96vw,1100px)','important');
 card.style.setProperty('height','min(94vh,900px)','important');
 card.style.setProperty('height','min(94dvh,900px)','important');
 card.style.setProperty('max-height','96vh','important');
 card.style.setProperty('max-height','96dvh','important');
 card.style.setProperty('min-height','0','important');
 burstFlameConfetti();
 document.getElementById('status').textContent="🔥 FINAL 30 SECONDS — YOUR CHALLENGE STARTS NOW!";
}
function resetBattle(){battleActive=false;popupShown=false;autoSpun=false;pendingChallenge=null;closeResultOverlay();document.body.classList.remove('active');document.getElementById('challenge').textContent="Waiting for the next battle…";document.getElementById('status').textContent="Battle ended · Waiting for the next TikTok battle.";}
function beginBattle(data){
 const duration=Number(data.battleDuration||data.durationSec||300);
 battleDuration=duration>0?duration:300;battleStartAt=Date.now();battleActive=true;popupShown=false;autoSpun=false;
 document.body.classList.remove('active');document.getElementById('challenge').textContent="Challenge will be revealed near the end…";
 document.getElementById('status').textContent="Battle detected · Wheel appears after 1 minute.";
}
function updateBattleClock(data){
 if(!battleActive){const duration=Number(data.durationSec||data.battleDuration||300);battleDuration=duration>0?duration:300;battleStartAt=Date.now()-Math.max(0,battleDuration-Number(data.secsRemaining||battleDuration))*1000;battleActive=true;}
 const remaining=Number(data.secsRemaining);
 if(Number.isFinite(remaining)){
  const elapsed=Math.max(0,battleDuration-remaining);
  if(remaining<=60&&remaining>30&&!autoSpun){showWheel();autoSpun=true;spin(true);}
  if(remaining<=30&&remaining>=0)revealPendingChallenge();
  if(remaining<=0)resetBattle();
 }
}
function handleBattleEvent(event,data){
 if(event==="battle"){
  const status=Number(data.status),key=String(data.battleId||data.matchId||"");
  if(status===1){if(!battleActive||!key||key!==lastBattleKey){lastBattleKey=key;beginBattle(data)}}
  else if(status===3){resetBattle();lastBattleKey=""}
 }else if(event==="battleArmies"){
  const status=Number(data.status);
  if(status===1||status===4||status===2){if(data.matchId)lastBattleKey=String(data.matchId);updateBattleClock(data);if(status===2&&Number(data.secsRemaining)===0)resetBattle()}
 }
}
function tickBattle(){
 if(!battleActive)return;
 const elapsed=(Date.now()-battleStartAt)/1000;
 const remaining=battleDuration-elapsed;
 if(remaining<=60&&remaining>30&&!autoSpun){showWheel();autoSpun=true;spin(true);}
 if(remaining<=30&&remaining>=0)revealPendingChallenge();
 if(remaining<=0){resetBattle();lastBattleKey=""}
}
setInterval(tickBattle,500);
function handleChat(data){
 const msg=String(data.comment||data.content||"").trim(),who=data.user?.nickname||data.nickname||data.user?.uniqueId||"Viewer";
 if(/^!help$/i.test(msg)){document.getElementById('status').textContent=who+": type !spin to trigger a random challenge.";return}
 if(/^!spin$/i.test(msg)){const now=Date.now();if(now-lastChatSpin<7000)return;lastChatSpin=now;document.getElementById('status').textContent=who+" called the Wheel of Doom!";spin()}
}
function connectChat(){
 try{chatSocket=new WebSocket("ws://localhost:21213/");chatSocket.onopen=()=>document.getElementById('status').textContent="TikFinity connected · Chat can use !spin";chatSocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="chat")handleChat(m.data||{});else if(m.event==="battle"||m.event==="battleArmies")handleBattleEvent(m.event,m.data||{})}catch(_){}};chatSocket.onclose=()=>{document.getElementById('status').textContent="TikFinity not connected · Button still works";setTimeout(connectChat,5000)};chatSocket.onerror=()=>{document.getElementById('status').textContent="Open TikFinity Desktop on this PC · Button still works"}}catch(_){}
}
connectChat();
</script>
</body></html>
